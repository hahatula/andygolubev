<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Qwen 7B EKS benchmark architecture</title>
  <desc id="desc">AWS EKS architecture showing vLLM benchmark client, round-robin service, llm-d EPP router, eight vLLM decode pods on GPU nodes, FSx for Lustre model storage, and Prometheus Grafana observability.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .section { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
      .title { fill: #111827; font: 700 26px Arial, sans-serif; }
      .section-title { fill: #374151; font: 700 15px Arial, sans-serif; }
      .box-title { fill: #111827; font: 700 15px Arial, sans-serif; }
      .box-text { fill: #374151; font: 13px Arial, sans-serif; }
      .small-text { fill: #4b5563; font: 12px Arial, sans-serif; }
      .route { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .compute { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; }
      .storage { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .obs { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .client { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .arrow { fill: none; stroke: #374151; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #6b7280; stroke-width: 1.7; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .legend-text { fill: #374151; font: 12px Arial, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="44" y="48">Qwen 7B on EKS: benchmark architecture</text>
  <text class="small-text" x="44" y="76">Same 8 vLLM decode pods; only the routing layer changes between round-robin and llm-d.</text>

  <rect class="section" x="40" y="104" width="1120" height="580" rx="8"/>
  <text class="section-title" x="64" y="132">AWS EKS benchmark cluster</text>

  <rect class="client" x="76" y="178" width="210" height="88" rx="8"/>
  <text class="box-title" x="181" y="211" text-anchor="middle">Benchmark client</text>
  <text class="box-text" x="181" y="235" text-anchor="middle">vLLM bench serve</text>
  <text class="box-text" x="181" y="255" text-anchor="middle">prefix_repetition workload</text>

  <rect class="route" x="374" y="132" width="244" height="90" rx="8"/>
  <text class="box-title" x="496" y="165" text-anchor="middle">Round-robin baseline</text>
  <text class="box-text" x="496" y="190" text-anchor="middle">Kubernetes ClusterIP Service</text>
  <text class="box-text" x="496" y="210" text-anchor="middle">no prefix-cache awareness</text>

  <rect class="route" x="374" y="278" width="244" height="94" rx="8"/>
  <text class="box-title" x="496" y="311" text-anchor="middle">llm-d routing path</text>
  <text class="box-text" x="496" y="336" text-anchor="middle">EPP endpoint picker</text>
  <text class="box-text" x="496" y="356" text-anchor="middle">precise prefix-cache scorer</text>

  <rect class="compute" x="705" y="168" width="314" height="174" rx="8"/>
  <text class="box-title" x="862" y="202" text-anchor="middle">GPU node group</text>
  <text class="box-text" x="862" y="228" text-anchor="middle">8 x g5.xlarge nodes</text>
  <text class="box-text" x="862" y="250" text-anchor="middle">1 x NVIDIA A10G per node</text>
  <text class="box-text" x="862" y="272" text-anchor="middle">1 vLLM decode pod per GPU</text>
  <text class="box-text" x="862" y="294" text-anchor="middle">independent KV cache per replica</text>

  <rect class="compute" x="706" y="386" width="314" height="90" rx="8"/>
  <text class="box-title" x="863" y="420" text-anchor="middle">System node</text>
  <text class="box-text" x="863" y="445" text-anchor="middle">m6i.4xlarge</text>
  <text class="box-text" x="863" y="465" text-anchor="middle">benchmark app, router, monitoring</text>

  <rect class="storage" x="705" y="526" width="314" height="96" rx="8"/>
  <text class="box-title" x="862" y="562" text-anchor="middle">FSx for Lustre</text>
  <text class="box-text" x="862" y="588" text-anchor="middle">Qwen2.5-7B-Instruct weights</text>
  <text class="box-text" x="862" y="610" text-anchor="middle">mounted by static PV/PVC</text>

  <rect class="obs" x="76" y="458" width="240" height="92" rx="8"/>
  <text class="box-title" x="196" y="492" text-anchor="middle">Observability</text>
  <text class="box-text" x="196" y="517" text-anchor="middle">Prometheus and Grafana</text>
  <text class="box-text" x="196" y="537" text-anchor="middle">vLLM, K8s, GPU metrics</text>

  <rect class="obs" x="76" y="586" width="240" height="78" rx="8"/>
  <text class="box-title" x="196" y="618" text-anchor="middle">NVIDIA GPU Operator</text>
  <text class="box-text" x="196" y="643" text-anchor="middle">device plugin and DCGM exporter</text>

  <rect class="storage" x="374" y="526" width="244" height="96" rx="8"/>
  <text class="box-title" x="496" y="562" text-anchor="middle">FSx CSI driver</text>
  <text class="box-text" x="496" y="588" text-anchor="middle">static persistent volumes</text>
  <text class="box-text" x="496" y="610" text-anchor="middle">model path mounted read-only</text>

  <path class="arrow" d="M 286 210 C 322 198, 336 184, 370 178"/>
  <path class="arrow" d="M 286 246 C 324 272, 338 306, 370 324"/>
  <path class="arrow" d="M 618 176 C 656 180, 672 194, 701 214"/>
  <path class="arrow" d="M 618 326 C 660 306, 676 286, 701 266"/>
  <path class="arrow" d="M 1018 294 C 1084 356, 1084 468, 988 524"/>
  <path class="arrow" d="M 618 574 L 701 574"/>
  <path class="arrow-soft" d="M 706 428 C 574 430, 418 450, 320 494"/>
  <path class="arrow-soft" d="M 317 626 C 340 626, 348 604, 370 594"/>
  <path class="arrow-soft" d="M 316 626 C 470 686, 774 686, 862 626"/>

  <rect class="route" x="64" y="704" width="20" height="14" rx="3"/>
  <text class="legend-text" x="92" y="716">routing</text>
  <rect class="compute" x="170" y="704" width="20" height="14" rx="3"/>
  <text class="legend-text" x="198" y="716">compute</text>
  <rect class="storage" x="286" y="704" width="20" height="14" rx="3"/>
  <text class="legend-text" x="314" y="716">storage</text>
  <rect class="obs" x="402" y="704" width="20" height="14" rx="3"/>
  <text class="legend-text" x="430" y="716">observability / operators</text>
</svg>
